services:
  devstation:
    image: ghcr.io/lucurlings/agent-devstation:latest
    init: true
    stdin_open: true
    tty: true
    environment:
      SDK_PYTHON: ${SDK_PYTHON-}
      SDK_NODE: ${SDK_NODE-}
      SDK_DOTNET: ${SDK_DOTNET-}
      SDK_JAVA: ${SDK_JAVA-}
      SDK_GO: ${SDK_GO-}
      SDK_RUST: ${SDK_RUST-}
      VSCODE_EDITOR_ENABLED: ${VSCODE_EDITOR_ENABLED-false}
      PASSWORD: ${EDITOR_PASSWORD-}
      DEV_UID: ${DEV_UID-1000}
      DEV_GID: ${DEV_GID-1000}
    volumes:
      - ./workspaces:/workspaces
      - devstation-home:/home/dev
    # Uncomment only when enabling the editor for local access.
    # ports:
    #   - "127.0.0.1:8080:8080"
    restart: unless-stopped

volumes:
  devstation-home:
