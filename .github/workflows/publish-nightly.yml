name: Publish nightly image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false
  queue: max

env:
  IMAGE: ghcr.io/lucurlings/agent-devstation
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:nightly-${{ env.SOURCE_SHA }}-${{ matrix.arch }}
      - name: Smoke-test the pushed architecture image
        run: |
          image="${IMAGE}:nightly-${SOURCE_SHA}-${{ matrix.arch }}"
          docker pull "$image"
          IMAGE="$image" bash tests/smoke.sh

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify nightly multi-platform tags
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:nightly-${SOURCE_SHA}" \
            "${IMAGE}:nightly-${SOURCE_SHA}-amd64" \
            "${IMAGE}:nightly-${SOURCE_SHA}-arm64"
          docker buildx imagetools inspect --raw "${IMAGE}:nightly-${SOURCE_SHA}" \
            | jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64", "arm64"]'
          main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [[ "${main_sha}" == "${SOURCE_SHA}" ]]; then
            docker buildx imagetools create \
              --tag "${IMAGE}:nightly" \
              "${IMAGE}:nightly-${SOURCE_SHA}"
          fi
