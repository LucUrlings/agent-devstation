name: Publish nightly image

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: false
  queue: max

env:
  IMAGE: ghcr.io/lucurlings/agent-devstation

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:nightly-${{ github.sha }}-${{ matrix.arch }}

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and verify nightly multi-platform tags
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:nightly-${GITHUB_SHA}" \
            "${IMAGE}:nightly-${GITHUB_SHA}-amd64" \
            "${IMAGE}:nightly-${GITHUB_SHA}-arm64"
          docker buildx imagetools inspect --raw "${IMAGE}:nightly-${GITHUB_SHA}" \
            | jq -e '([.manifests[].platform | select(.os == "linux") | .architecture] | sort) == ["amd64", "arm64"]'
          main_sha=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          if [[ "${main_sha}" == "${GITHUB_SHA}" ]]; then
            docker buildx imagetools create \
              --tag "${IMAGE}:nightly-latest" \
              "${IMAGE}:nightly-${GITHUB_SHA}"
          fi
