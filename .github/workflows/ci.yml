name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  image-and-sdk-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker compose config -q
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: agent-devstation:ci
          cache-from: type=gha,scope=agent-devstation-amd64
          cache-to: type=gha,scope=agent-devstation-amd64,mode=min,ignore-error=true
      - run: IMAGE=agent-devstation:ci bash tests/smoke.sh

  arm64-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: agent-devstation:ci
          cache-from: type=gha,scope=agent-devstation-arm64
          cache-to: type=gha,scope=agent-devstation-arm64,mode=min,ignore-error=true
      - run: docker run --rm agent-devstation:ci bash -lc 'codex --version && claude --version && gh --version && code-server --version'
