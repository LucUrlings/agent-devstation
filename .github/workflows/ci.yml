name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  agent-versions:
    runs-on: ubuntu-26.04
    outputs:
      codex: ${{ steps.resolve.outputs.codex }}
      claude: ${{ steps.resolve.outputs.claude }}
    steps:
      - uses: actions/checkout@v7
      - id: resolve
        run: bash scripts/resolve-agent-versions.sh >> "$GITHUB_OUTPUT"

  image-and-sdk-smoke:
    needs: agent-versions
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker compose config -q
      - name: Load bubblewrap AppArmor profile
        run: |
          test -f /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: agent-devstation:ci
          build-args: |
            CODEX_VERSION=${{ needs.agent-versions.outputs.codex }}
            CLAUDE_VERSION=${{ needs.agent-versions.outputs.claude }}
          cache-from: type=gha,scope=agent-devstation-amd64
          cache-to: type=gha,scope=agent-devstation-amd64,mode=min,ignore-error=true
      - run: IMAGE=agent-devstation:ci bash tests/smoke.sh

  arm64-build:
    needs: agent-versions
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Load bubblewrap AppArmor profile
        run: |
          test -f /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: agent-devstation:ci
          build-args: |
            CODEX_VERSION=${{ needs.agent-versions.outputs.codex }}
            CLAUDE_VERSION=${{ needs.agent-versions.outputs.claude }}
          cache-from: type=gha,scope=agent-devstation-arm64
          cache-to: type=gha,scope=agent-devstation-arm64,mode=min,ignore-error=true
      - run: IMAGE=agent-devstation:ci bash tests/smoke.sh
