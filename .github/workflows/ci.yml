name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  image-and-sdk-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker compose config -q
      - run: docker buildx build --platform linux/amd64 --load -t agent-devstation:ci .
      - run: IMAGE=agent-devstation:ci bash tests/smoke.sh

  arm64-build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker buildx build --platform linux/arm64 --output type=cacheonly .
